# EAS Update - Over-the-air updates (no app store review needed)
# Use this for JavaScript/asset changes only
name: EAS Update

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: false
        default: 'Bug fixes and improvements'

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            BRANCH="production"
          else
            BRANCH="staging"
          fi

          MESSAGE="${{ github.event.inputs.message || 'Update from CI' }}"

          eas update --branch $BRANCH --message "$MESSAGE" --non-interactive
